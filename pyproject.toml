[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "option-risk-explain"
version = "0.2.0"
description = "Option Risk Explain: equity-option P&L attribution and exception review"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
market = ["yfinance>=0.2.66,<1"]
dev = ["pytest>=8"]

[project.scripts]
option-risk-explain = "option_lab.cli:main"
option-lab = "option_lab.cli:main"

[tool.setuptools.packages.find]
include = ["option_lab*"]

[tool.setuptools.data-files]
"share/option-risk-explain/docs" = [
  "docs/index.html",
  "docs/styles.css",
  "docs/market.css",
  "docs/app.js",
  "docs/market.js",
  "docs/pricing.mjs",
  "docs/risk.js",
  "docs/risk.css",
  "docs/risk-first.css",
  "docs/brand.css",
  "docs/risk-demo.json",
  "docs/risk-scenarios.json",
  "docs/positions_2026-10-05.csv",
  "docs/positions_2026-10-06.csv",
  "docs/.nojekyll",
]
"share/option-risk-explain/docs/assets" = ["docs/assets/favicon.svg"]
